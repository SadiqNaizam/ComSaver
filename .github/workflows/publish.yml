name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # 1. Explicitly declare the environment to access its secrets
    environment: PUBLISH_PAT 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Publish to Visual Studio Marketplace
        uses: lannonbr/vsce-action@4.0.0
        with:
          # 2. Use the updated variable name here
          args: "publish -p $VSCODE_PAT"
        env:
          # 3. Pull the specific secret from the environment
          VSCODE_PAT: ${{ secrets.VSCODE_PAT }}