<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="380" height="380" fill="#1e1e1e"/>
  <rect x="0" y="40" width="380" height="300" fill="#252526"/>

  <g transform="translate(0,40)">
    <!-- sidebar header -->
    <g transform="translate(10,7)" stroke="#bbbbbb" fill="none">
      <path d="M2 4C2 3.44772 2.44772 3 3 3H13C13.5523 3 14 3.44772 14 4V12C14 12.5523 13.5523 13 13 13H3C2.44772 13 2 12.5523 2 12V4Z" stroke-width="1.1"/>
      <path d="M4.5 6.3L6.7 8L4.5 9.7" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 9.7H10.8" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <text x="30" y="20" font-size="11" font-weight="700" letter-spacing="0.5" fill="#bbbbbb">COMMAND SAVER</text>

    <!-- add command button -->
    <rect x="8" y="32" width="364" height="28" rx="4" fill="#0e639c"/>
    <g transform="translate(134,39)" stroke="#ffffff">
      <path d="M8 2.5V13.5M2.5 8H13.5" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="156" y="50" font-size="13" font-weight="600" fill="#ffffff">Add Command</text>

    <!-- global section header -->
    <g transform="translate(10,72) scale(0.8125)" stroke="#9d9d9d" fill="none">
      <circle cx="8" cy="8" r="5.6" stroke-width="1.2"/>
      <path d="M2.4 8H13.6M8 2.4C9.4 4 10.1 6 10.1 8C10.1 10 9.4 12 8 13.6C6.6 12 5.9 10 5.9 8C5.9 6 6.6 4 8 2.4Z" stroke-width="1.2"/>
    </g>
    <text x="28" y="84" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9d9d9d">GLOBAL COMMANDS</text>

    <!-- row: start dev server (hover state) -->
    <rect x="4" y="93" width="372" height="30" rx="5" fill="#2a2d2e"/>
    <g transform="translate(10,101)" stroke="#9d9d9d" fill="none">
      <path d="M2 3.5C2 2.94772 2.44772 2.5 3 2.5H13C13.5523 2.5 14 2.94772 14 3.5V12.5C14 13.0523 13.5523 13.5 13 13.5H3C2.44772 13.5 2 13.0523 2 12.5V3.5Z" stroke-width="1.3"/>
      <path d="M4.5 6L7 8.2L4.5 10.4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.5 10.4H11.5" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="34" y="105" font-size="13" font-weight="600" fill="#e8e8e8">Start dev server</text>
    <text x="34" y="118" font-size="11" font-family="Menlo, monospace" fill="#9d9d9d">npm run dev</text>
    <g transform="translate(294,100) scale(0.875)" fill="#89d185">
      <path d="M4.5 3.2C4.5 2.6 5.15 2.24 5.66 2.55L12.5 6.85C12.98 7.15 12.98 7.85 12.5 8.15L5.66 12.45C5.15 12.76 4.5 12.4 4.5 11.8V3.2Z"/>
    </g>
    <g transform="translate(316,100) scale(0.875)" stroke="#cccccc" fill="none">
      <path d="M10.6 2.6L13.4 5.4L5.8 13H3V10.2L10.6 2.6Z" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <g transform="translate(338,100) scale(0.875)" stroke="#cccccc" fill="none">
      <rect x="5.5" y="5.5" width="8" height="8" rx="1.3" stroke-width="1.3"/>
      <path d="M3.5 10.5V3.3C3.5 2.86 3.86 2.5 4.3 2.5H10.5" stroke-width="1.3"/>
    </g>
    <g transform="translate(360,100) scale(0.875)" stroke="#cccccc" fill="none">
      <path d="M3 4.5H13" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4.5 4.5L5.1 12.4C5.14 12.9 5.56 13.3 6.06 13.3H9.94C10.44 13.3 10.86 12.9 10.9 12.4L11.5 4.5" stroke-width="1.3" stroke-linejoin="round"/>
    </g>

    <!-- expanded preview -->
    <rect x="34" y="127" width="330" height="24" rx="4" fill="#1a1a1a"/>
    <text x="42" y="143" font-size="11" font-family="Menlo, monospace" fill="#d4d4d4">npm run dev</text>

    <!-- row: clean install -->
    <g transform="translate(10,167)" stroke="#9d9d9d" fill="none">
      <path d="M2 3.5C2 2.94772 2.44772 2.5 3 2.5H13C13.5523 2.5 14 2.94772 14 3.5V12.5C14 13.0523 13.5523 13.5 13 13.5H3C2.44772 13.5 2 13.0523 2 12.5V3.5Z" stroke-width="1.3"/>
      <path d="M4.5 6L7 8.2L4.5 10.4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.5 10.4H11.5" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="34" y="171" font-size="13" font-weight="600" fill="#e8e8e8">Clean install</text>
    <text x="34" y="184" font-size="11" font-family="Menlo, monospace" fill="#9d9d9d">rm -rf node_modules &amp;&amp; npm install</text>

    <!-- row: docker prune -->
    <g transform="translate(10,203)" stroke="#9d9d9d" fill="none">
      <path d="M2 3.5C2 2.94772 2.44772 2.5 3 2.5H13C13.5523 2.5 14 2.94772 14 3.5V12.5C14 13.0523 13.5523 13.5 13 13.5H3C2.44772 13.5 2 13.0523 2 12.5V3.5Z" stroke-width="1.3"/>
      <path d="M4.5 6L7 8.2L4.5 10.4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.5 10.4H11.5" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="34" y="207" font-size="13" font-weight="600" fill="#e8e8e8">Docker prune</text>
    <text x="34" y="220" font-size="11" font-family="Menlo, monospace" fill="#9d9d9d">docker system prune -f</text>

    <!-- workspace section header -->
    <g transform="translate(10,239) scale(0.8125)" stroke="#9d9d9d" fill="none">
      <path d="M2.5 4.3C2.5 3.86 2.86 3.5 3.3 3.5H6.4L7.6 4.9H12.7C13.14 4.9 13.5 5.26 13.5 5.7V11.7C13.5 12.14 13.14 12.5 12.7 12.5H3.3C2.86 12.5 2.5 12.14 2.5 11.7V4.3Z" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <text x="28" y="250" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9d9d9d">WORKSPACE COMMANDS</text>

    <!-- row: run migrations -->
    <g transform="translate(10,262)" stroke="#9d9d9d" fill="none">
      <path d="M2 3.5C2 2.94772 2.44772 2.5 3 2.5H13C13.5523 2.5 14 2.94772 14 3.5V12.5C14 13.0523 13.5523 13.5 13 13.5H3C2.44772 13.5 2 13.0523 2 12.5V3.5Z" stroke-width="1.3"/>
      <path d="M4.5 6L7 8.2L4.5 10.4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.5 10.4H11.5" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="34" y="266" font-size="13" font-weight="600" fill="#e8e8e8">Run migrations</text>
    <text x="34" y="279" font-size="11" font-family="Menlo, monospace" fill="#9d9d9d">npm run db:migrate</text>
  </g>
</svg>
